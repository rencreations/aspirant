# Served by nginxinc/nginx-unprivileged on :8080 (non-root, no privileged ports).
server {
    # IPv4 only on purpose: `listen [::]:8080` makes nginx fail to start on hosts/containers
    # without IPv6. To enable it, add `listen [::]:8080 default_server;` here.
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;     # keep redirects relative; the container sits behind proxies
    port_in_redirect off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml image/svg+xml application/manifest+json application/wasm;

    # Liveness endpoint for HEALTHCHECK / orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Content-hashed build assets are safe to cache forever.
    location /_next/static/ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static media: cache for a week and revalidate.
    location ~* \.(?:svg|ico|png|jpe?g|webp|avif|gif|woff2?|glb|gltf|hdr|ktx2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    # HTML and everything else: always revalidate so deploys show up immediately.
    # `trailingSlash: true` exports pages as /route/index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
