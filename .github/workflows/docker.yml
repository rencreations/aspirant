name: Container

# Build, scan, smoke-test and e2e-test the image on every PR.
# On main and version tags, publish a signed multi-arch image to GHCR with SBOM + provenance.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    name: Build, scan and test image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, loaded locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: aspirant-web:ci
          build-args: |
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aspirant-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy image scan (SARIF for code scanning)
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aspirant-web:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
        env:
          TRIVY_SKIP_DB_UPDATE: "false"

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Start container
        run: |
          docker run -d --name web -p 8080:8080 --read-only \
            --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run \
            --cap-drop ALL --security-opt no-new-privileges \
            aspirant-web:ci
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done

      - name: Smoke test (health, headers, caching, non-root)
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/healthz | grep -q ok
          curl -fsSI http://127.0.0.1:8080/ | tee /tmp/headers.txt
          grep -qi '^content-security-policy:' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^cache-control: no-cache' /tmp/headers.txt
          test "$(docker exec web id -u)" != "0"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/does-not-exist/)" = "404"
          docker inspect --format '{{.State.Health.Status}}' web || true

      - uses: ./.github/actions/setup-pnpm

      - name: Install Playwright browser
        run: pnpm --filter @aspirant/web exec playwright install --with-deps chromium

      - name: E2E against the running container
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: pnpm --filter @aspirant/web exec playwright test --project=chromium

      - name: Container logs
        if: failure()
        run: docker logs web

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-container
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish to GHCR
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push image
      id-token: write # keyless cosign + provenance attestation
      attestations: write # GitHub build provenance attestation
    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short

      - name: Build and push (multi-arch, SBOM, max provenance)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container
          cache-to: type=gha,scope=container,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, by digest)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Generate CycloneDX SBOM from the published image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json

      - name: Attach SBOM to the image as a signed attestation
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate sbom-image.cdx.json \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Verify the signature:"
            echo '```'
            echo "cosign verify ${IMAGE}@${{ steps.build.outputs.digest }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
