name: Deploy to GitHub Pages

# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The site is served from the custom domain https://aspirant.cc (set in Settings -> Pages), which is
# a domain root, so BASE_PATH is empty. Only set the repository variable BASE_PATH if the site is
# ever served from a sub-path again (for example the project page /aspirant). SITE_URL defaults to
# the custom domain and is used for metadata, the sitemap and robots.txt.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        id: pages
        with:
          enablement: true
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://aspirant.cc' }}
      - name: Ensure .nojekyll (serve the _next directory)
        run: touch apps/web/out/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test the deployed site
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Deployed site did not return HTTP 200" >&2
          exit 1
