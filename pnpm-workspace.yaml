packages:
  - apps/*
  - packages/*

# Single source of truth for dependency versions. Workspace packages reference
# these with `"dep": "catalog:"` so every package stays on the same version.
catalog:
  # --- Framework -----------------------------------------------------------
  next: ^16.0.0
  react: ^19.0.0
  react-dom: ^19.0.0
  typescript: ~6.0.0
  "@types/node": ^22.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0

  # --- Styling / UI --------------------------------------------------------
  tailwindcss: ^4.0.0
  "@tailwindcss/postcss": ^4.0.0
  postcss: ^8.0.0
  tw-animate-css: ^1.0.0
  radix-ui: ^1.0.0
  class-variance-authority: ^0.7.0
  clsx: ^2.0.0
  tailwind-merge: ^3.0.0
  lucide-react: ^1.0.0
  next-themes: ^0.4.0
  sonner: ^2.0.0
  cmdk: ^1.0.0
  vaul: ^1.0.0
  embla-carousel-react: ^8.0.0
  react-day-picker: ^10.0.0
  react-resizable-panels: ^4.0.0
  input-otp: ^1.0.0
  recharts: ^3.0.0
  date-fns: ^4.0.0

  # --- TanStack ------------------------------------------------------------
  "@tanstack/react-query": ^5.0.0
  "@tanstack/react-query-devtools": ^5.0.0
  "@tanstack/react-query-persist-client": ^5.0.0
  "@tanstack/query-sync-storage-persister": ^5.0.0
  "@tanstack/eslint-plugin-query": ^5.0.0
  "@tanstack/react-table": ^9.0.0
  "@tanstack/react-form": ^1.0.0
  "@tanstack/react-virtual": ^3.0.0
  "@tanstack/react-store": ^0.11.0
  "@tanstack/react-hotkeys": ^0.13.0
  "@tanstack/react-pacer": ^0.24.0
  "@tanstack/react-ranger": ^0.0.5
  "@tanstack/react-devtools": ^0.10.0
  "@tanstack/react-db": ^0.5.0
  "@tanstack/db": ^0.13.0
  "@tanstack/query-db-collection": ^1.0.0
  geist: ^1.0.0

  # --- 3D / animation ------------------------------------------------------
  three: ^0.186.0
  "@types/three": ^0.186.0
  "@react-three/fiber": ^9.0.0
  "@react-three/drei": ^10.0.0
  "@react-three/postprocessing": ^3.0.0
  postprocessing: ^6.0.0
  gsap: ^3.0.0
  "@gsap/react": ^2.0.0
  motion: ^14.0.0
  lenis: ^1.0.0

  # --- State / data / validation ------------------------------------------
  zustand: ^5.0.0
  zod: ^4.0.0

  # --- Lint / format / commit ---------------------------------------------
  eslint: ^9.0.0
  "@eslint/js": ^9.0.0
  eslint-config-next: ^16.0.0
  eslint-config-prettier: ^10.0.0
  eslint-plugin-react-hooks: ^7.0.0
  globals: ^17.0.0
  typescript-eslint: ^8.0.0
  prettier: ^3.0.0
  prettier-plugin-tailwindcss: ^0.8.0
  husky: ^9.0.0
  lint-staged: ^16.0.0
  "@commitlint/cli": ^21.0.0
  "@commitlint/config-conventional": ^21.0.0
  knip: ^6.0.0

  # --- Build / test --------------------------------------------------------
  turbo: ^2.0.0
  vite: ^8.0.0
  vitest: ^5.0.0
  "@vitest/coverage-v8": ^5.0.0
  "@vitejs/plugin-react": ^6.0.0
  jsdom: ^29.0.0
  "@testing-library/react": ^16.0.0
  "@testing-library/jest-dom": ^7.0.0
  "@testing-library/user-event": ^14.0.0
  "@playwright/test": ^1.0.0
  "@axe-core/playwright": ^4.0.0
  serve: ^14.0.0
  "@cyclonedx/cdxgen": ^12.0.0

# pnpm 10 blocks dependency lifecycle scripts by default. Allow only what we need.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - "@parcel/watcher"

# @tanstack/react-ranger still declares a React <=18 peer range, but works with 19.
peerDependencyRules:
  allowedVersions:
    "@tanstack/react-ranger>react": "19"

# Supply-chain hardening: refuse versions published less than 24h ago.
minimumReleaseAge: 1440

# Reproducible, strict installs.
autoInstallPeers: true
strictPeerDependencies: false
